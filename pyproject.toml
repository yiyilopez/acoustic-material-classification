[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "acustica-materiales"
version = "0.1.0"
description = "Laboratorio de Física: inspección trazable de sonidos de impacto."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24,<3",
  "soundfile>=0.13,<1",
  "matplotlib>=3.7,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
analisis = ["scipy>=1.10,<2", "scikit-learn>=1.3,<2"]

[project.scripts]
acustica = "acustica_materiales.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
